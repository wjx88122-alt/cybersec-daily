<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 纪衡 - 产品办公室：理性、平衡、边界清晰 -->
  <defs>
    <linearGradient id="jh-bg" x1="0" y1="0" x2="320" y2="320">
      <stop stop-color="#0f1729"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="jh-glow" cx="0.5" cy="0.3">
      <stop stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="320" height="320" rx="48" fill="url(#jh-bg)"/>
  <circle cx="160" cy="110" r="150" fill="url(#jh-glow)"/>

  <!-- 服装 - 衬衫 -->
  <path d="M78 280 L118 198 L160 172 L202 198 L242 280 Z" fill="#1a2840"/>
  <path d="M138 195 L160 215 L182 195 L160 320 Z" fill="#e8f0ff" opacity="0.9"/>
  <path d="M160 215 L160 320" stroke="#3b82f6" stroke-width="2.5" opacity="0.4"/>

  <!-- 头部 - 放大 -->
  <ellipse cx="160" cy="126" rx="80" ry="92" fill="#d8b896"/>

  <!-- 发型 - 中分、整齐、对称 -->
  <path d="M80 96 Q78 40 160 32 Q242 40 240 96 Q235 82 220 70 Q195 54 160 52 Q125 54 100 70 Q85 82 80 96 Z" fill="#2a2a3a"/>
  <path d="M160 52 L160 85" stroke="#1a1a2a" stroke-width="3"/>
  <path d="M100 70 Q130 62 160 60" stroke="#1a1a2a" stroke-width="2.5" fill="none"/>
  <path d="M160 60 Q190 62 220 70" stroke="#1a1a2a" stroke-width="2.5" fill="none"/>

  <!-- 眉毛 - 平和、对称 -->
  <path d="M115 110 Q130 107 150 110" stroke="#3a3a4a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M170 110 Q190 107 205 110" stroke="#3a3a4a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 眼睛 - 平静、理性 -->
  <ellipse cx="130" cy="135" rx="8" ry="10" fill="#2a2a3a"/>
  <ellipse cx="190" cy="135" rx="8" ry="10" fill="#2a2a3a"/>
  <circle cx="132" cy="133" r="2.5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="192" cy="133" r="2.5" fill="#3b82f6" opacity="0.8"/>

  <!-- 鼻子 -->
  <path d="M160 142 L160 163" stroke="#c4a886" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M155 163 Q160 165 165 163" stroke="#c4a886" stroke-width="2.5"/>

  <!-- 嘴 - 中性、平和 -->
  <path d="M140 182 Q160 184 180 182" stroke="#9a7a6a" stroke-width="4" stroke-linecap="round"/>

  <!-- 标志性元素 - 天平/平衡符号 -->
  <path d="M240 100 L275 100" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="240" cy="100" r="7" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.6"/>
  <circle cx="275" cy="100" r="7" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M257.5 88 L257.5 100" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
