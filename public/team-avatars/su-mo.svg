<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 苏墨 - 表达与材料官：精致、克制、文雅 -->
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="320" y2="320">
      <stop stop-color="#1a0f1e"/>
      <stop offset="1" stop-color="#2d1a3e"/>
    </linearGradient>
    <radialGradient id="sm-glow" cx="0.5" cy="0.3">
      <stop stop-color="#d946ef" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="320" height="320" rx="48" fill="url(#sm-bg)"/>
  <circle cx="160" cy="110" r="150" fill="url(#sm-glow)"/>

  <!-- 服装 - 优雅套装 -->
  <path d="M72 280 L112 198 L160 173 L208 198 L248 280 Z" fill="#1a1028"/>
  <path d="M136 195 L160 213 L184 195 L160 320 Z" fill="#d946ef" opacity="0.25"/>

  <!-- 头部 - 放大 -->
  <ellipse cx="160" cy="126" rx="78" ry="90" fill="#e4c0a8"/>

  <!-- 发型 - 长发、柔顺、优雅 -->
  <path d="M82 96 Q80 42 160 35 Q240 42 238 96 Q234 128 226 150 L218 168 Q212 182 205 195 L192 210 Q178 218 160 218 Q142 218 128 210 L115 195 Q108 182 102 168 L94 150 Q86 128 82 96 Z" fill="#2a1a28"/>
  <path d="M94 108 Q100 78 160 70 Q220 78 226 108" stroke="#1a0a18" stroke-width="2.5" fill="none"/>
  <path d="M88 130 Q94 150 105 168" stroke="#1a0a18" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M232 130 Q226 150 215 168" stroke="#1a0a18" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- 眉毛 - 细长、优雅 -->
  <path d="M116 109 Q129 106 148 109" stroke="#3a2a38" stroke-width="3" stroke-linecap="round"/>
  <path d="M172 109 Q191 106 204 109" stroke="#3a2a38" stroke-width="3" stroke-linecap="round"/>

  <!-- 眼睛 - 温和、专注 -->
  <ellipse cx="130" cy="133" rx="7" ry="9" fill="#2a1a28"/>
  <ellipse cx="190" cy="133" rx="7" ry="9" fill="#2a1a28"/>
  <circle cx="132" cy="131" r="2.5" fill="#d946ef" opacity="0.9"/>
  <circle cx="192" cy="131" r="2.5" fill="#d946ef" opacity="0.9"/>

  <!-- 鼻子 -->
  <path d="M160 140 L160 159" stroke="#d4a898" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M156 159 Q160 161 164 159" stroke="#d4a898" stroke-width="2"/>

  <!-- 嘴 - 温和微笑 -->
  <path d="M142 180 Q160 184 178 180" stroke="#a87a6a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 标志性元素 - 钢笔/书写工具 -->
  <path d="M245 95 L265 75" stroke="#d946ef" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <circle cx="265" cy="75" r="4" fill="#d946ef" opacity="0.7"/>
  <path d="M250 105 L270 105" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M252 115 L268 115" stroke="#d946ef" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
