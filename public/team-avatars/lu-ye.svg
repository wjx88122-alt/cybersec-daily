<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 陆野 - 一线作战官：务实、直接、接地气 -->
  <defs>
    <linearGradient id="ly-bg" x1="0" y1="0" x2="320" y2="320">
      <stop stop-color="#0a1a14"/>
      <stop offset="1" stop-color="#1a3a2a"/>
    </linearGradient>
    <radialGradient id="ly-glow" cx="0.5" cy="0.3">
      <stop stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="320" height="320" rx="48" fill="url(#ly-bg)"/>
  <circle cx="160" cy="110" r="150" fill="url(#ly-glow)"/>

  <!-- 服装 - 工装/夹克 -->
  <path d="M70 280 L110 195 L160 170 L210 195 L250 280 Z" fill="#1a2820"/>
  <path d="M132 192 L160 208 L188 192 L160 320 Z" fill="#10b981" opacity="0.25"/>
  <rect x="148" y="230" width="24" height="8" rx="2" fill="#10b981" opacity="0.4"/>

  <!-- 头部 - 放大 -->
  <ellipse cx="160" cy="128" rx="79" ry="91" fill="#d4a87a"/>

  <!-- 发型 - 短发、硬朗、略乱 -->
  <path d="M81 98 Q79 43 160 36 Q241 43 239 98 Q235 88 223 75 Q198 57 160 55 Q122 57 97 75 Q85 88 81 98 Z" fill="#2a2520"/>
  <path d="M92 82 Q98 70 108 62" stroke="#1a1510" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M228 82 Q222 70 212 62" stroke="#1a1510" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M115 68 L125 75" stroke="#1a1510" stroke-width="2" stroke-linecap="round"/>
  <path d="M205 68 L195 75" stroke="#1a1510" stroke-width="2" stroke-linecap="round"/>

  <!-- 眉毛 - 浓眉、自然 -->
  <path d="M113 113 Q128 109 148 112" stroke="#3a2a20" stroke-width="5" stroke-linecap="round"/>
  <path d="M172 112 Q192 109 207 113" stroke="#3a2a20" stroke-width="5" stroke-linecap="round"/>

  <!-- 眼睛 - 坚定、直视 -->
  <ellipse cx="128" cy="137" rx="8" ry="10" fill="#2a2520"/>
  <ellipse cx="192" cy="137" rx="8" ry="10" fill="#2a2520"/>
  <circle cx="130" cy="135" r="3" fill="#10b981" opacity="0.8"/>
  <circle cx="194" cy="135" r="3" fill="#10b981" opacity="0.8"/>

  <!-- 鼻子 -->
  <path d="M160 144 L160 165" stroke="#c49870" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M155 165 Q160 167 165 165" stroke="#c49870" stroke-width="2.5"/>

  <!-- 嘴 - 微笑、亲和 -->
  <path d="M140 184 Q160 189 180 184" stroke="#9a7a5a" stroke-width="4" stroke-linecap="round"/>

  <!-- 标志性元素 - 对讲机/通讯设备 -->
  <rect x="68" y="135" width="12" height="28" rx="3" fill="#10b981" opacity="0.6"/>
  <circle cx="74" cy="145" r="2.5" fill="#10b981"/>
  <rect x="70" y="155" width="8" height="3" rx="1" fill="#10b981" opacity="0.8"/>
  <path d="M74 163 L74 170" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
