<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 程准 - 总裁PMO：高效、精准、执行力强 -->
  <defs>
    <linearGradient id="cz-bg" x1="0" y1="0" x2="320" y2="320">
      <stop stop-color="#1a0f0a"/>
      <stop offset="1" stop-color="#3a2515"/>
    </linearGradient>
    <radialGradient id="cz-glow" cx="0.5" cy="0.3">
      <stop stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="320" height="320" rx="48" fill="url(#cz-bg)"/>
  <circle cx="160" cy="110" r="150" fill="url(#cz-glow)"/>

  <!-- 服装 - 运动风格 -->
  <path d="M72 280 L112 195 L160 168 L208 195 L248 280 Z" fill="#1a1410"/>
  <path d="M130 190 L160 208 L190 190 L160 320 Z" fill="#f97316" opacity="0.3"/>
  <circle cx="160" cy="240" r="9" fill="#f97316" opacity="0.5"/>

  <!-- 头部 - 放大 -->
  <ellipse cx="160" cy="127" rx="77" ry="89" fill="#c49a7a"/>

  <!-- 发型 - 短发、干练、微卷 -->
  <path d="M83 97 Q81 42 160 34 Q239 42 237 97 Q233 85 222 73 Q200 56 160 54 Q120 56 98 73 Q87 85 83 97 Z" fill="#2a2020"/>
  <path d="M95 82 Q102 68 115 60" stroke="#1a1515" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M225 82 Q218 68 205 60" stroke="#1a1515" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 眉毛 - 上扬、有力 -->
  <path d="M114 112 Q130 107 150 111" stroke="#3a2a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 111 Q190 107 206 112" stroke="#3a2a2a" stroke-width="5" stroke-linecap="round"/>

  <!-- 眼睛 - 锐利、专注 -->
  <ellipse cx="129" cy="136" rx="8" ry="10" fill="#2a2020"/>
  <ellipse cx="191" cy="136" rx="8" ry="10" fill="#2a2020"/>
  <circle cx="131" cy="134" r="3" fill="#f97316" opacity="0.9"/>
  <circle cx="193" cy="134" r="3" fill="#f97316" opacity="0.9"/>

  <!-- 鼻子 -->
  <path d="M160 143 L160 164" stroke="#b48a6a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M155 164 Q160 166 165 164" stroke="#b48a6a" stroke-width="2.5"/>

  <!-- 嘴 - 坚定、有力 -->
  <path d="M140 183 Q160 181 180 183" stroke="#8a6050" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 标志性元素 - 进度条/时间线 -->
  <rect x="235" y="90" width="55" height="7" rx="3.5" fill="#f97316" opacity="0.3"/>
  <rect x="235" y="90" width="38" height="7" rx="3.5" fill="#f97316" opacity="0.7"/>
  <rect x="235" y="108" width="55" height="7" rx="3.5" fill="#f97316" opacity="0.3"/>
  <rect x="235" y="108" width="46" height="7" rx="3.5" fill="#f97316" opacity="0.7"/>
  <circle cx="273" cy="93.5" r="5" fill="#f97316"/>
</svg>
